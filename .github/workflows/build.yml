name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential

      - name: Pico SDK
        uses: actions/checkout@v5
        with:
          repository: raspberrypi/pico-sdk
          ref: "2.1.1"
          path: pico-sdk

      - name: Pico SDK submodules (tinyusb only)
        run: git -C pico-sdk submodule update --init lib/tinyusb

      - name: Build
        run: |
          cmake -B build -DPICO_SDK_PATH=$GITHUB_WORKSPACE/pico-sdk
          cmake --build build -j4

      - uses: actions/upload-artifact@v5
        with:
          name: pico_sd_diag
          path: build/pico_sd_diag.uf2

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/pico_sd_diag.uf2
